<!DOCTYPE html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reino Financeiro</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--g:#f5c542;--c:#241848;--c2:#33236b;--t:#fff4d6;--m:#b9b0dc;--ok:#2ead6b;--bad:#e8466b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(#2b1b5a,#140d2b) fixed;color:var(--t);font:600 14px system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Press Start 2P',Georgia,serif;font-weight:400;margin:0 0 10px;line-height:1.5;color:var(--g)}h1{font-size:15px}h2{font-size:12px}h3{font-size:10px}
header{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap}header .x{flex:1;min-width:180px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;position:sticky;top:0;background:#140d2bee;z-index:5}
button,.b{border:2px solid var(--g);background:var(--c2);color:var(--t);border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer;white-space:nowrap}
button.on,.p{background:var(--g);color:#2a1a00}button.r{border-color:var(--bad)}
main{padding:10px;max-width:1100px;margin:auto}.k{background:var(--c);border:2px solid var(--g);border-radius:12px;padding:12px;margin:0 0 12px;box-shadow:0 4px 0 #0007}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.st b{display:block;font-size:18px;color:var(--g)}small,.m{color:var(--m)}
input,select{background:#fff4d6;color:#0b2a8a;border:2px solid #b88a14;border-radius:6px;padding:6px;font:inherit;max-width:100%}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:4px 6px;border-bottom:1px solid #fff2;text-align:left;white-space:nowrap}th{color:var(--g);font-size:11px}td input{width:84px}td input[type=text]{width:150px}
.bar{height:12px;background:#0006;border-radius:6px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--g)}
.ch{display:inline-block;margin:3px;padding:7px 10px;border:2px dashed var(--g);border-radius:20px;cursor:pointer;background:#fff1}.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}.lg i{display:inline-block;width:10px;height:10px;margin-right:4px}
#ts{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--g);color:#2a1a00;padding:9px 16px;border-radius:20px;display:none;z-index:9}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.px{display:inline-block;width:1.45em;height:1.45em;vertical-align:-.4em;margin-right:.25em;background-position:center;background-size:contain;background-repeat:no-repeat;flex:none}
h1 .px{width:1.9em;height:1.9em;vertical-align:-.6em}h2 .px,h3 .px{width:1.8em;height:1.8em;vertical-align:-.55em}
button .px{width:1.6em;height:1.6em;vertical-align:-.45em}
.dot{display:inline-block;width:.85em;height:.85em;border-radius:3px;border:2px solid #0007;vertical-align:-.1em;margin-right:.3em}

/* ===== Visual geral ===== */
body{background:radial-gradient(ellipse at 50% -10%,#3b2480,#1b1040 55%,#120a28) fixed}
header{background:linear-gradient(#2e1f62,#1b1040);border-bottom:3px solid var(--g);box-shadow:0 4px 0 #0007;padding:8px 14px;gap:12px;flex-wrap:nowrap}
header .x{min-width:0}header h1{margin:0;font-size:14px;white-space:nowrap}header small{display:block;margin-top:2px}
button,.b{background:linear-gradient(#4d38a8,#33236b);box-shadow:0 3px 0 #0009,inset 0 1px 0 #ffffff33;transition:transform .08s,box-shadow .08s;font-weight:700}
button:hover{filter:brightness(1.12)}button:active{transform:translateY(2px);box-shadow:0 1px 0 #0009}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.on{background:linear-gradient(#ffdc70,#f0b52a);color:#2a1a00;box-shadow:0 3px 0 #7a5200,inset 0 1px 0 #fff8}
.p{background:linear-gradient(#45dc8b,#17884e);color:#fff;border-color:#c4ffdc;text-shadow:0 2px 0 #0a4a26}
button.r{background:linear-gradient(#f4627a,#b3213f);color:#fff;border-color:#ffc0ca;text-shadow:0 2px 0 #5a0f20}
.k{background:linear-gradient(#2a1c58,#1d1340);border:2px solid var(--g);box-shadow:inset 0 0 0 3px #3d2b7c,0 0 0 2px #6d4a00,0 6px 0 #0008;border-radius:10px;padding:14px}
nav#nv{background:#140d2bf2;border-bottom:2px solid #f5c54255}nav#nv button{display:flex;align-items:center}
.bar{height:14px;border:2px solid #0008;background:#0a0618}.bar i{background:linear-gradient(#ffe27a,#f5b300)}
.st b{font-size:17px}

/* ===== Nível (estrela) ===== */
.star{--s:64px;width:var(--s);height:calc(var(--s)*1.03);position:relative;flex:none;background-position:center;background-size:contain;background-repeat:no-repeat;container-type:inline-size;filter:drop-shadow(0 0 7px #f5c54288)}
.star b{position:absolute;left:0;right:0;text-align:center;font-family:'Press Start 2P',monospace;font-weight:400;color:#3a2000;text-shadow:0 1px 0 #ffeaa6;line-height:1}
.star .sl{top:31%;font-size:11cqw}.star .sn{top:51%;font-size:30cqw}.star .sn.d2{font-size:23cqw;top:53%}.star .sn.d3{font-size:17cqw;top:55%}
.star.up{animation:up 1.1s ease-out 2}@keyframes up{40%{transform:scale(1.35) rotate(-8deg);filter:drop-shadow(0 0 16px #fff)}}
.lvl{display:flex;align-items:center;gap:12px}.lvl .li{min-width:0;flex:1}.lt{font-size:12px;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl .bar i,.lvbox .bar i{background:linear-gradient(#8dff6a,#22a85a)}
.lvbox{display:flex;align-items:center;gap:10px;min-width:150px}.lvbox .lvl{width:100%}
#dlv{margin:4px 0 14px;padding:10px;border:2px solid #f5c54266;border-radius:10px;background:#0003}

/* ===== Cartões financeiros ===== */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:4px 0 14px;align-items:start}
.fc{position:relative;background-position:center;background-size:100% 100%;background-repeat:no-repeat;container-type:inline-size}
.fv{position:absolute;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;white-space:nowrap;color:#72f62e;
 text-shadow:2px 2px 0 #0b3a05,-1px -1px 0 #0b3a05,1px -1px 0 #0b3a05,-1px 1px 0 #0b3a05}
.fv.neg{color:#ff6577;text-shadow:2px 2px 0 #4a0b18,-1px -1px 0 #4a0b18,1px -1px 0 #4a0b18,-1px 1px 0 #4a0b18}
.fd{position:absolute;background:#1b0e27;display:flex;align-items:center;justify-content:center}
.fb{position:relative;width:92%;height:62%;border:2px solid #e8a020;border-radius:999px;background:#12081f;overflow:hidden}
.fb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff7a68,#c4261a)}
.fb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;color:#fff;white-space:nowrap;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}

/* ===== Menu lateral + barra inferior (só no celular) ===== */
.ham{display:none;width:48px;height:48px;padding:0;flex-direction:column;justify-content:center;align-items:center;gap:6px;flex:none}
.ham i{display:block;width:24px;height:4px;background:var(--g);box-shadow:0 2px 0 #0009}
#dw{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);transform:translateX(-105%);transition:transform .22s ease;z-index:60;background:linear-gradient(#2e1f62,#140d2b);border-right:3px solid var(--g);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));visibility:hidden}
#dw.open{transform:none;visibility:visible}
#dw .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--g);font:400 11px 'Press Start 2P',monospace}
#dw .dh button{width:44px;height:44px;padding:0}
#dl button{display:flex;align-items:center;width:100%;text-align:left;min-height:52px;margin:0 0 8px;font-size:15px;white-space:normal}
#dl button .px{width:32px;height:32px;margin-right:12px}
.da{display:grid;gap:8px;margin-top:14px;border-top:2px dashed #f5c54255;padding-top:14px}.da button{min-height:50px;font-size:15px}
#sc{position:fixed;inset:0;background:#000b;z-index:55;display:none}#sc.open{display:block}
#bb{display:none}

@media(max-width:760px){
 body{font-size:15px}
 header{position:sticky;top:0;z-index:30;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
 header h1{font-size:12px}.ham{display:flex}.hd2{display:none}.lvbox{min-width:0}.lvbox .li{display:none}
 nav#nv{display:none}
 main{padding:10px 10px calc(96px + env(safe-area-inset-bottom))}
 .k{padding:12px 11px}h2{font-size:11px}
 button,.b{min-height:46px;padding:10px 14px;font-size:15px}
 input,select{min-height:46px;font-size:16px;padding:8px 10px;width:100%}
 input[type=checkbox]{width:24px;min-height:24px}
 .row{flex-direction:column;align-items:stretch}
 .row>input,.row>select,.row>label{width:100%!important;flex:1 1 auto}
 .row>button{width:100%}
 .row.h2c{flex-direction:row}
 .gr{grid-template-columns:repeat(2,1fr)}
 .cards{grid-template-columns:repeat(2,1fr);gap:8px}.cards .fc:last-child{grid-column:1/-1;width:50%;justify-self:center}
 .ch{padding:11px 14px;font-size:14px;margin:4px 3px}
 svg{max-width:100%;height:auto}
 /* tabelas viram cartões */
 .w{overflow:visible}
 table,tbody{display:block;width:100%}
 tr.hd{display:none}
 tr{display:block;margin:0 0 10px;padding:8px 12px;background:#ffffff0c;border:2px solid #f5c54244;border-radius:10px}
 td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:6px 0;white-space:normal;text-align:right;width:100%}
 td::before{content:attr(data-label);flex:0 0 36%;text-align:left;color:var(--m);font-size:12px}
 td[data-label='']::before{display:none}td[data-label='']{justify-content:flex-end}
 td:empty{display:none}
 td:first-child{font-weight:800;color:var(--g);border-bottom:1px dashed #fff3;padding-bottom:8px;margin-bottom:2px}
 td input,td select,td input[type=text]{width:60%!important;min-width:0;flex:1}
 td button{min-width:60px}
 #ts{bottom:calc(86px + env(safe-area-inset-bottom));max-width:92vw;text-align:center}
 #bb{display:flex;position:fixed;top:auto;height:auto;overflow:visible;left:0;right:0;bottom:0;z-index:30;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(#2e1f62,#140d2b);border-top:3px solid var(--g);box-shadow:0 -4px 0 #0006}

function pxify(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),A=[];while(w.nextNode())A.push(w.currentNode);
 A.forEach(n=>{if(/^(OPTION|SCRIPT|STYLE|TEXTAREA|TITLE)$/.test(n.parentNode.nodeName))return;const s=n.nodeValue;RX.lastIndex=0;if(!RX.test(s))return;RX.lastIndex=0;
  const f=document.createDocumentFragment();let last=0,m,ch=0;
  while(m=RX.exec(s)){const k=m[0].replace(/\uFE0F/g,''),ic=EM[k],dc=DOT[k];if(!ic&&!dc)continue;
   if(m.index>last)f.append(s.slice(last,m.index));const e=document.createElement('i');
   if(ic)e.className='px i-'+ic;else{e.className='dot';e.style.background=dc}e.setAttribute('role','img');f.append(e);last=m.index+m[0].length;ch=1}
  if(!ch)return;if(last<s.length)f.append(s.slice(last));n.replaceWith(f)})}
